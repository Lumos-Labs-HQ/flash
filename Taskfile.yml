version: "3"

vars:
   BINARY: flash
   BUILD_DIR: build
   VERSION:
      sh: grep 'Version = ' cmd/root.go | head -1 | sed 's/.*"\(.*\)".*/\1/'
   LDFLAGS: -s -w -X 'github.com/Lumos-Labs-HQ/flash/cmd.Version={{.VERSION}}'

tasks:
   # DEV
   test-gen:
      desc: Run tests with generated code
      cmds:
         - task: build
         - cd example/go && rm -rf flash_gen && ../../flash gen -f
         - cd example/java && rm -rf kotlin && rm -rf java && ../../flash gen -f
         - cd example/python && rm -rf flash_gen && ../../flash gen -f
         - cd example/ts && rm -rf flash_gen && ../../flash gen -f
         - cd example/rust && rm -rf flash_gen && ../../flash gen -f

   build:
      desc: Build development binary
      cmds:
         - go build -tags="dev,plugins"
         - echo "Dev build"

   install:
      desc: Build and install dev binary to $GOPATH/bin
      cmds:
         - task: build
         - go install -tags="dev,plugins"
         - echo "Installed binary"

   pkg-update:
      desc: Update all mod files with latest versions
      cmds:
         - go get -u ./... && go mod tidy
         - cd plugins/core && go get -u ./... && go mod tidy
         - cd plugins/studio && go get -u ./... && go mod tidy

   chmod:
      cmds:
         - chmod +x ./gotest.sh
          
   test:
      desc: Run all tests (unit + integration) with dev + plugins tags
      cmds:
         - task: build
         - task: chmod
         - ./gotest.sh all

   smoke:
      desc: Run all unit tests (excludes integration tests requiring Docker/DB)
      cmds:
         - task: chmod
         - ./gotest.sh

   race:
      desc: Run unit tests with the race detector (excludes integration)
      cmds:
         - task: chmod
         - ./gotest.sh race

   test-integration:
      desc: Run all command integration tests (sqlite runs locally with no server; postgres/mysql skip when unreachable)
      cmds:
         - task: build
         - task: chmod
         - ./gotest.sh integration
         - rm flash

   # ── Shared ───────────────────────────────────────────────────────────

   version:
      desc: Print current version
      cmds:
         - echo "v{{.VERSION}}"

   fmt:
      desc: Format code
      cmds:
         - go fmt ./...
         - echo "Code formatted"

   lint:
      desc: Run linter
      cmds:
         - golangci-lint run
         - echo "Linting complete"
